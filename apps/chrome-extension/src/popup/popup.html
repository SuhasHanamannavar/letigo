<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Litigo</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #0a0a0a;
      --muted: #6b7280;
      --accent: #b45309;
      --accent-soft: rgba(180,83,9,.10);
      --border: rgba(10,10,10,.08);
      --success: #166534;
      --success-soft: rgba(22,101,52,.10);
      --warning: #92400e;
      --warning-soft: rgba(146,64,14,.10);
      --error: #991b1b;
      --error-soft: rgba(153,27,27,.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      min-height: 480px;
      font-family: 'Archivo', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .brand-name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -.01em;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-active {
      background: var(--success-soft);
      color: var(--success);
    }
    .status-inactive {
      background: rgba(107,114,128,.12);
      color: var(--muted);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .chatbot-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chatbot-name {
      font-weight: 600;
      font-size: 14px;
    }
    .chatbot-none {
      color: var(--muted);
      font-size: 13px;
    }
    .compliance {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .compliance-score {
      text-align: center;
    }
    .score-value {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }
    .score-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .compliance-stats {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .stat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }
    .stat-value {
      font-weight: 600;
    }
    .rules-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .rule-stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .rule-stat-value {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
    }
    .rule-stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .violations-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 140px;
      overflow-y: auto;
    }
    .violation-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .violation-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }
    .violation-content {
      flex: 1;
      min-width: 0;
    }
    .violation-rule {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .violation-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }
    .empty-state {
      text-align: center;
      padding: 16px;
      color: var(--muted);
      font-size: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 500;
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      background: rgba(107,114,128,.3);
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s ease;
    }
    .toggle.active {
      background: var(--success);
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform .15s ease;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .toggle.active::after {
      transform: translateX(16px);
    }
    .footer-nav {
      display: flex;
      border-top: 1px solid var(--border);
    }
    .footer-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      transition: color .15s ease, background .15s ease;
    }
    .footer-btn:hover {
      color: var(--text);
      background: rgba(10,10,10,.03);
    }
    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width .3s ease;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(10,10,10,.15);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="../../icons/icon-32.png" alt="Litigo" class="brand-logo" />
      <span class="brand-name">Litigo</span>
    </div>
    <span id="statusBadge" class="status-badge status-active">
      <span class="status-dot" style="background:var(--success);"></span>
      Active
    </span>
  </div>

  <div class="section">
    <div class="section-label">Current Chatbot</div>
    <div class="chatbot-info">
      <span id="chatbotName" class="chatbot-none">No supported chatbot detected</span>
      <span id="rulesCount" class="mono" style="font-size:11px;color:var(--muted);">—</span>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Compliance</div>
    <div class="compliance">
      <div class="compliance-score">
        <div id="scoreValue" class="score-value">—</div>
        <div class="score-label">Compliance</div>
        <div class="progress-bar" style="width:80px;margin:6px auto 0;">
          <div id="scoreBar" class="progress-fill" style="width:0%;background:var(--success);"></div>
        </div>
      </div>
      <div class="compliance-stats">
        <div class="stat-row">
          <span class="stat-label"><span style="color:var(--success);">✓</span> Passed</span>
          <span id="passedCount" class="stat-value mono">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-label"><span style="color:var(--warning);">⚠</span> Warnings</span>
          <span id="warningCount" class="stat-value mono">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-label"><span style="color:var(--error);">✗</span> Violations</span>
          <span id="violationCount" class="stat-value mono">—</span>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Rules</div>
    <div class="rules-summary">
      <div class="rule-stat">
        <div id="activeRules" class="rule-stat-value">—</div>
        <div class="rule-stat-label">Active rules</div>
      </div>
      <div class="rule-stat">
        <div id="totalViolations" class="rule-stat-value">—</div>
        <div class="rule-stat-label">Total violations</div>
      </div>
    </div>
  </div>

  <div class="section" style="border-bottom:none;">
    <div class="section-label">Recent Violations</div>
    <div id="violationsList" class="violations-list">
      <div class="empty-state">No recent violations</div>
    </div>
  </div>

  <div class="section" style="border-bottom:none;padding-top:10px;padding-bottom:10px;">
    <div class="toggle-row">
      <span class="toggle-label">Enable Litigo</span>
      <div id="litigoToggle" class="toggle active"></div>
    </div>
  </div>

  <div class="footer-nav">
    <button class="footer-btn" id="btnRules">Rules</button>
    <button class="footer-btn" id="btnSettings">Settings</button>
    <button class="footer-btn" id="btnHelp">Help</button>
  </div>

  <script>
    // Popup logic
    (function() {
      const litigoEnabled = true;

      // Request status from content script or background
      chrome.tabs.query({ active: true, currentWindow: true }, function(tabs) {
        const tab = tabs[0];
        if (!tab) return;

        // Try to get status from content script
        chrome.tabs.sendMessage(tab.id, { type: 'LITIGO_STATUS' }, function(response) {
          if (response && !chrome.runtime.lastError) {
            updateUI(response);
          } else {
            // Fallback: show stored data
            loadStoredData();
          }
        });
      });

      // Listen for compliance updates
      chrome.runtime.onMessage.addListener(function(message) {
        if (message.type === 'COMPLIANCE_UPDATED') {
          updateUI({
            enabled: litigoEnabled,
            score: message.score,
            passed: message.passed,
            warnings: message.warnings,
            violations: message.violations,
          });
        }
      });

      function updateUI(status) {
        const badge = document.getElementById('statusBadge');
        if (status.enabled) {
          badge.className = 'status-badge status-active';
          badge.innerHTML = '<span class="status-dot" style="background:var(--success);"></span>Active';
        } else {
          badge.className = 'status-badge status-inactive';
          badge.innerHTML = '<span class="status-dot" style="background:var(--muted);"></span>Disabled';
        }

        if (status.chatbotName) {
          document.getElementById('chatbotName').textContent = status.chatbotName;
          document.getElementById('chatbotName').className = 'chatbot-name';
        }

        if (typeof status.score === 'number') {
          document.getElementById('scoreValue').textContent = status.score;
          const bar = document.getElementById('scoreBar');
          bar.style.width = status.score + '%';
          bar.style.background = status.score >= 80 ? 'var(--success)' :
                                  status.score >= 60 ? 'var(--warning)' : 'var(--error)';
          document.getElementById('scoreValue').style.color = status.score >= 80 ? 'var(--success)' :
                                              status.score >= 60 ? 'var(--warning)' : 'var(--error)';
        }

        if (typeof status.passed === 'number') document.getElementById('passedCount').textContent = status.passed;
        if (typeof status.warnings === 'number') document.getElementById('warningCount').textContent = status.warnings;
        if (typeof status.violations === 'number') document.getElementById('violationCount').textContent = status.violations;
        if (typeof status.rulesCount === 'number') document.getElementById('rulesCount').textContent = status.rulesCount + ' rules';
        if (typeof status.activeRules === 'number') document.getElementById('activeRules').textContent = status.activeRules;
      }

      function loadStoredData() {
        chrome.storage.local.get(['litigo_rules', 'litigo_activity'], function(data) {
          const rules = data['litigo_rules'] || [];
          const activity = data['litigo_activity'] || [];
          const activeRules = rules.filter(r => r.status === 'enabled').length;
          const totalViolations = rules.reduce((sum, r) => sum + (r.violationCount || 0), 0);

          document.getElementById('activeRules').textContent = activeRules;
          document.getElementById('totalViolations').textContent = totalViolations;

          // Show recent violations from activity
          const violations = activity
            .filter(a => a.result === 'violated' || a.result === 'warning')
            .slice(0, 3);

          if (violations.length > 0) {
            const list = document.getElementById('violationsList');
            list.innerHTML = violations.map(v => `
              <div class="violation-item">
                <span class="violation-icon" style="color:${v.result === 'violated' ? 'var(--error)' : 'var(--warning)'}">
                  ${v.result === 'violated' ? '✗' : '⚠'}
                </span>
                <div class="violation-content">
                  <div class="violation-rule">${escapeHtml(v.ruleName || 'Unknown rule')}</div>
                  <div class="violation-meta">${v.chatbotName} · ${formatTime(v.timestamp)}</div>
                </div>
              </div>
            `).join('');
          }
        });
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function formatTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      // Toggle
      document.getElementById('litigoToggle').addEventListener('click', function() {
        this.classList.toggle('active');
        const enabled = this.classList.contains('active');
        chrome.tabs.query({ active: true, currentWindow: true }, function(tabs) {
          if (tabs[0]) {
            chrome.tabs.sendMessage(tabs[0].id, { type: 'TOGGLE_LITIGO', enabled });
          }
        });
        const badge = document.getElementById('statusBadge');
        if (enabled) {
          badge.className = 'status-badge status-active';
          badge.innerHTML = '<span class="status-dot" style="background:var(--success);"></span>Active';
        } else {
          badge.className = 'status-badge status-inactive';
          badge.innerHTML = '<span class="status-dot" style="background:var(--muted);"></span>Disabled';
        }
      });

      // Footer buttons
      document.getElementById('btnRules').addEventListener('click', function() {
        chrome.runtime.openOptionsPage();
      });
      document.getElementById('btnSettings').addEventListener('click', function() {
        chrome.runtime.openOptionsPage();
      });
      document.getElementById('btnHelp').addEventListener('click', function() {
        chrome.tabs.create({ url: 'https://litigo-ai.vercel.app/' });
      });
    })();
  </script>
</body>
</html>
